# It's possible to use Regular expresions for the ignore files
# Remember that any special character for regular expresions needs to be preceed by \ to match it
.run:
    - "--account="
    - "#PBS -A "
    - "echo $(date +%c) : compute"
    - 'echo " \$\(date \+"%Y-%m-%d %H:%M:%S.%3N"\) | PROGRESS | compute'
    - "export ACCOUNT="
    - "export USER="
finished_config:
    - "  jobid: "
    - "  check: "
    - "  original_command: "
    - "  ACCOUNT: "
    - "  account: "
    - "  accounting_flag: "
    - "  esm_tools_version: "
    - "  logfile_path: "
    - "  logfile_path_in_run: "
finished_config_dicts:
    - "files_missing_when_preparing_run"
