# Runscript based on runscripts/foci/foci-initial-scenario_run.yaml
general:
   use_venv: False
   verbose: False
   setup_name: "foci"
   version: "default"

   # operational settings: yearly restarts
   compute_time: "00:15:00"
   initial_date: "2015-01-01T00:00:00"       # Initial exp. date
   final_date: "2015-01-03T00:00:00"         # Final date of the experiment
   postprocessing: 0
   nday: 1

   # machine specific setup
   account: !ENV ${ACCOUNT}
   base_dir: !ENV ${ESM_TESTING_DIR}

foci:
   model_dir: !ENV ${MODEL_DIR}

echam:
   # all ssp* scenarios use historical forcing before 2015, i.e. the setting
   # scenario: "cmip6hist" and # scenario: "ssp???" produce the same results 
   # until year 2014
   # available scenarios: 1percCO2, ssp126, ssp245, ssp370, ssp585, ssp585os
   # technically tested: cmip6hist, ssp370 and ssp585
   # seb-wahl, 2021-08-11
   scenario: "ssp585"
   resolution: "T63"
   restart_rate: ${general.nday}
   restart_unit: "days"
   nproca: 8
   nprocb: 4

nemo:
   resolution: "ORCA05"
   version: "ORCA05_LIM2_KCM_AOW"
   restart_rate: ${general.nday}
   restart_unit: "days"
   nproc: 24
   #jpni: 24
   #jpnj: 20
   #nproc: 480 
   # jpni and jpnj are 0 by default, i.e. automatic distribution on CPUs
   #
xios:
   nproc: 8
oasis3mct:
    # Needed so that the tests in the GitHub machines can run
    # otherwise the tests fail
    choose_general.check:
        True:
            ini_parent_dir: "${general.esm_configs_dir}/../src/esm_tests/resources/runscripts/foci/run_files4check_runs/foci-initial-ssp-scenario/"
