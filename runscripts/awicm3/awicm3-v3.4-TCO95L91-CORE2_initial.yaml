general:
    setup_name: "awicm3"
    version: "develop"
    account: !ENV ${ACCOUNT}
    compute_time: "00:20:00"
    initial_date: "2000-01-01"
    final_date: "2000-01-03"
    base_dir: !ENV ${ESM_TESTING_DIR}
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awicm3:
    postprocessing: false
    model_dir: !ENV ${MODEL_DIR}

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    nproc: 128
    tar_binary_restarts: true
    #namelist_dir: "${model_dir}/config/"

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 128
    omp_num_threads: 1

    # A trick to get the wam_namelist in dryruns in "fake" levante on github actions
    choose_general.check:
        True:
            wam_namelist: "${general.esm_function_dir}/../src/esm_tests/resources/runscripts/awicm3/run_files4check_runs/awicm3-v3.4-TCO95L91-CORE2_initial/wam_namelist"

oasis3mct:
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 7200

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32

