general:
    account: !ENV ${ACCOUNT}
    setup_name: "awicm3"
    version: "v3.3.0"
    compute_time: "01:00:00"
    initial_date: "2000-01-01"
    final_date: "2000-01-03"
    base_dir: !ENV ${ESM_TESTING_DIR}
    nday: 1
    nmonth: 0
    nyear: 0

awicm3:
    postprocessing: false
    model_dir: !ENV ${MODEL_DIR}
    choose_computer.name:
        juwels:
            pool_dir: "/p/project/chhb19/streffing1/input/"

fesom:
    resolution: "CORE2"
    choose_computer.name:
        juwels:
            pool_dir: "/p/project/chhb19/streffing1/input/fesom2/"
            rnproc: 144
        aleph:
            rnproc: 40
        blogin:
            rnproc: 192
        levante:
            rnproc: 128
        albedo:
            rnproc: 128
    nproc: ${rnproc}
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    tar_binary_restarts: true

oifs:
    resolution: "TCO95"
    levels: "L91"
    lresume: false
    time_step: 3600
    prepifs_expid: aack
    input_expid: awi3
    wam: true
    choose_computer.name:
        juwels:
            rnproc: 24
        aleph:
            rnproc: 80
        blogin:
            rnproc: 48
        levante:
            rnproc: 128
        albedo:
            rnproc: 128
    nproc: ${rnproc}
    omp_num_threads: 2

oasis3mct:
    lresume: false # Set to false to generate the rst files for first leg
    time_step: 7200

xios:
    with_model: oifs
    nproc: 4
    choose_computer.name:
        levante:
            omp_num_threads: 32
        juwels:
            omp_num_threads: 12

