general:
    account: !ENV ${ACCOUNT}
    setup_name: "awiesm3"
    version: "develop"
    compute_time: "00:30:00"
    initial_date: "1900-01-01"
    final_date: "1900-01-04"
    base_dir: !ENV ${ESM_TESTING_DIR}
    nday: 1
    nmonth: 0
    nyear: 0

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: !ENV ${MODEL_DIR}

fesom:
    resolution: "CORE2"
    restart_rate: 1
    restart_unit: "d"
    restart_first: 1
    lresume: false
    time_step: 1800
    choose_computer.name:
        levante:
            rnproc: 256
    nproc: ${rnproc}
    omp_num_threads: 1 # originally 4 but worked with 1
    tar_binary_restarts: true

lpj_guess:
    lresume: false 
    nproc: 8 # originally 16
    omp_num_threads: 8

oifs:
    resolution: TL255
    levels: "L91"
    prepifs_expid: abl7
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 2400
    choose_computer.name:
        levante:
            rnproc: 512
    nproc: ${rnproc}
    omp_num_threads: 2
    mpi: cmip6 #for cmip6 simulations!
    scenario: piControl #solar radiation is going to be taken always from 1850

oasis3mct:
    use_lucia: false #Set to TRUE if you want more diagnostics, if set to FALSE is ~5-10% faster
    lresume: true # Set to false to generate the rst files for first leg
    time_step: 7200
    norestart: false #Do i restart from vegin or not?

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
