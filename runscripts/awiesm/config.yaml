comp:
        actual:
                files:
                    - "bin/fesom.x"
                    - "bin/echam6"
        check: {}
run:
        actual:
                errors:
                    - "MISSING FILES"
                    - "Coupling var not found"
                files:
                    - "restart/echam/restart*.nc*"
                    - "outdata/echam/*"
                    # Files specific to versions 2
                    - "outdata/fesom/*.fesom.*.nc except [2.1]" # no daily output for 2.1
                    - "restart/fesom/fesom.*.oce.restart.nc* except [2.6.2]"
                    - "restart/fesom/fesom.*.ice.restart.nc* except [ 2.6.2]"
                    # Files specific to version 2.6
                    - "restart/fesom/fesom.*.oce.restart/*.nc in [2.6.2]"
                    - "restart/fesom/fesom.*.ice.restart/*.nc in [2.6.2]"
        check: {}

ignore_compare:
    awiesm-2.1_icebergs:
        finished_config:
            # Icebergs ignored lines
            - "iceberg_dir: /home/ollie/lackerma/ICEBERGS/ib_10000/"
