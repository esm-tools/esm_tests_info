comp:
        actual:
                files:
                    - "bin/fesom.x except [1.4]"
                    - "bin/fesom in [1.4]"
        check: {}
run:
        actual:
                errors:
                    - "MISSING FILES"
                files:
                    # Files specific to version 1.4
                    - "outdata/fesom/*_fesom_*.nc in [1.4]"
                    - "restart/fesom/fesom.*.oce.nc in [1.4]"
                    - "restart/fesom/fesom.*.ice.nc in [1.4]"
                    # Files specific to versions 2
                    - "outdata/fesom/*.fesom.*.nc except [1.4]"
                    - "restart/fesom/fesom.*.oce.restart.nc* except [1.4, 2.6, 2.7]"
                    - "restart/fesom/fesom.*.ice.restart.nc* except [1.4, 2.6, 2.7]"
                    # Files specific to version 2.6
                    - "restart/fesom/fesom.*.oce.restart/*.nc in [2.6]"
                    - "restart/fesom/fesom.*.ice.restart/*.nc in [2.6]"
                    # Files specific to version 2.7
                    - "restart/fesom/fesom.*.oce.restart/*.nc in [2.7]"
                    - "restart/fesom/fesom.*.ice.restart/*.nc in [2.7]"
        check: {}
computers:
        - ollie
        - levante
        #- albedo
        - blogin
ignore_runscripts:
        # fesom2.7-initial-monthly-levante.yaml is levante-only: it hardcodes
        # the levante pool/mesh dirs under /work/ab0246 and only defines nproc
        # under choose_computer.name: levante. There is no baseline for it on
        # any other machine either.
        ollie:
                - fesom2.7-initial-monthly-levante.yaml
        blogin:
                - fesom2.7-initial-monthly-levante.yaml
