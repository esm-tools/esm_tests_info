general:
    account: !ENV ${ACCOUNT}
    setup_name: fesom
    version: "1.4"
    compute_time: "00:20:00"
    initial_date: "1950-01-01"
    final_date: "1950-01-03"
    base_dir: !ENV ${ESM_TESTING_DIR}
    nyear: 0
    nmonth: 0
    nday: 1

fesom:
    model_dir: !ENV ${MODEL_DIR}
    restart_rate: 1
    restart_first: 1
    restart_unit: "d"

    choose_computer.name:
        levante:
            rpool_dir: /work/ab0995/a270152/testing_pool/AWICM/FESOM1/
            rmesh_dir: /work/ab0995/a270152/testing_pool/AWICM/FESOM1/MESHES/core/
            rproc: 384
        mistral:
            rpool_dir: /work/bm0944/input/
            rmesh_dir: /pool/data/AWICM/FESOM1/MESHES/core/
            rproc: 288
        ollie:
            rpool_dir: "${computer.pool_directories.pool}/FESOM/"
            rmesh_dir: "${computer.pool_directories.pool}/FESOM/meshes_default/core/"
            rproc: 288
        albedo:
            rpool_dir: "${computer.pool_directories.pool}/FESOM/"
            rmesh_dir: "${computer.pool_directories.pool}/FESOM/meshes_default/core/"
            rproc: 384
    pool_dir: ${fesom.rpool_dir}
    mesh_dir: ${fesom.rmesh_dir}

    opbnd_dir: "remove_from_namelist"
    tide_forcing_dir: "remove_from_namelist"
    nproc: ${rproc}
