# Base script provided by Lars Ackermann, copied from:
# /work/ab0246/a270124/esm-experiments/awiesm-2.6/LIG/test05/scripts/fesom2.6-levante-reference.yaml
general:
        account: !ENV ${ACCOUNT}
        setup_name: fesom
        comp_version: 2.7 # for esm_tests to find the correct comp directory
        version: 2.7
        compute_time: "00:10:00"
        initial_date: '1960-01-01'
        final_date: '1960-01-04'
        base_dir: !ENV ${ESM_TESTING_DIR}
        nyear: 0
        nmonth: 0
        nday: 1
        use_venv: False

fesom:
        model_dir: !ENV ${MODEL_DIR}
        resolution: "CORE2"
        pool_dir: "/work/ab0246/a270092/input/"
        mesh_dir: "/work/ab0246/a270092/input/fesom2/core2/" #"/home/a/a270064/bb1029/inputs/mesh_core2/"
        restart_rate: 1
        restart_first: 1
        restart_unit: 'd'
        time_step: 1800
        choose_computer.name:
            levante:
                nproc: 128
                omp_num_threads: 2
